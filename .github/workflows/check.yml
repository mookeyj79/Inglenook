name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install zsh, for checking shell files
        run: sudo apt-get update -q && sudo apt-get install -y -q zsh
      - name: Test the build modules
        shell: pwsh
        run: ./build/test.ps1
      - name: Run checks
        shell: pwsh
        run: ./build/check.ps1
