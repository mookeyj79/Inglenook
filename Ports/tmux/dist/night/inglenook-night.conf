# Inglenook Night for tmux, from Inglenook 1.0.0: https://github.com/mookeyj79/Inglenook
# Save it as ~/.config/tmux/inglenook-night.conf and add this line to tmux.conf:
#   source-file ~/.config/tmux/inglenook-night.conf
# Colors only: it changes no keys, formats or layout. Needs tmux 3.4 or later.

# The status line: a recessed bar, like a title bar
set -g status-style "fg=#b1aa9e,bg=#12100e"
set -g status-left-style "fg=#d1c9bc,bg=#12100e"
set -g status-right-style "fg=#b1aa9e,bg=#12100e"

# The window list: the current window is "you are here"
set -g window-status-style "fg=#b1aa9e,bg=#12100e"
set -g window-status-last-style "fg=#b1aa9e,bg=#12100e"
set -g window-status-current-style "fg=#f3a958,bg=#1b1917"
set -g window-status-activity-style "fg=#89b3d8,bg=#12100e"
set -g window-status-bell-style "fg=#bdb377,bg=#12100e,bold"

# Pane borders: the active pane is "you are here"
set -g pane-border-style "fg=#363331"
set -g pane-active-border-style "fg=#f3a958"

# Messages and the command prompt
# fill covers the whole line in tmux 3.7 and later
set -g message-style "fg=#d1c9bc,bg=#262321,fill=#262321"
set -g message-command-style "fg=#d1c9bc,bg=#262321,fill=#262321"

# Copy mode and the choose modes: the selection and the selected row.
# Newer tmux takes the copy mode selection and position styles from this one.
set -g mode-style "fg=#d1c9bc,bg=#463624"

# Copy mode search: every match, then the match at the cursor
set -g copy-mode-match-style "fg=#d1c9bc,bg=#31383e"
set -g copy-mode-current-match-style "fg=#12100e,bg=#f3a958"

# Copy mode: the line holding the mark
set -g copy-mode-mark-style "fg=#d1c9bc,bg=#403434"

# Menus and popups
set -g menu-style "fg=#d1c9bc,bg=#262321"
set -g menu-selected-style "fg=#d1c9bc,bg=#463624"
set -g menu-border-style "fg=#363331,bg=#262321"
set -g popup-style "fg=#d1c9bc,bg=#262321"
set -g popup-border-style "fg=#363331,bg=#262321"

# The pane numbers display-panes shows, and the clock mode clock
set -g display-panes-colour "#89b3d8"
set -g display-panes-active-colour "#f3a958"
set -g clock-mode-colour "#89b3d8"

# Newer tmux only: -q skips them quietly where tmux does not have them
# Pane scrollbars (tmux 3.6 and later): the slider and its track
set -gq pane-scrollbars-style "fg=#8f887f,bg=#171412,width=1,pad=0"
# Copy mode line numbers (tmux 3.7 and later)
set -gq copy-mode-line-number-style "fg=#8f887f"
set -gq copy-mode-current-line-number-style "fg=#f3a958"
