# Inglenook Day for tmux, from Inglenook 1.0.0: https://github.com/mookeyj79/Inglenook
# Save it as ~/.config/tmux/inglenook-day.conf and add this line to tmux.conf:
#   source-file ~/.config/tmux/inglenook-day.conf
# Colors only: it changes no keys, formats or layout. Needs tmux 3.4 or later.

# The status line: a recessed bar, like a title bar
set -g status-style "fg=#49545d,bg=#e0e2dc"
set -g status-left-style "fg=#2d373f,bg=#e0e2dc"
set -g status-right-style "fg=#49545d,bg=#e0e2dc"

# The window list: the current window is "you are here"
set -g window-status-style "fg=#49545d,bg=#e0e2dc"
set -g window-status-last-style "fg=#49545d,bg=#e0e2dc"
set -g window-status-current-style "fg=#9b5a00,bg=#f1f3ee"
set -g window-status-activity-style "fg=#326893,bg=#e0e2dc"
set -g window-status-bell-style "fg=#706416,bg=#e0e2dc,bold"

# Pane borders: the active pane is "you are here"
set -g pane-border-style "fg=#cfd2cb"
set -g pane-active-border-style "fg=#9b5a00"

# Messages and the command prompt
# fill covers the whole line in tmux 3.7 and later
set -g message-style "fg=#2d373f,bg=#f9fbf8,fill=#f9fbf8"
set -g message-command-style "fg=#2d373f,bg=#f9fbf8,fill=#f9fbf8"

# Copy mode and the choose modes: the selection and the selected row.
# Newer tmux takes the copy mode selection and position styles from this one.
set -g mode-style "fg=#2d373f,bg=#e3dbc8"

# Copy mode search: every match, then the match at the cursor
set -g copy-mode-match-style "fg=#2d373f,bg=#d2dddf"
set -g copy-mode-current-match-style "fg=#f9fbf8,bg=#9b5a00"

# Copy mode: the line holding the mark
set -g copy-mode-mark-style "fg=#2d373f,bg=#e1dad7"

# Menus and popups
set -g menu-style "fg=#2d373f,bg=#f9fbf8"
set -g menu-selected-style "fg=#2d373f,bg=#e3dbc8"
set -g menu-border-style "fg=#cfd2cb,bg=#f9fbf8"
set -g popup-style "fg=#2d373f,bg=#f9fbf8"
set -g popup-border-style "fg=#cfd2cb,bg=#f9fbf8"

# The pane numbers display-panes shows, and the clock mode clock
set -g display-panes-colour "#326893"
set -g display-panes-active-colour "#9b5a00"
set -g clock-mode-colour "#326893"

# Newer tmux only: -q skips them quietly where tmux does not have them
# Pane scrollbars (tmux 3.6 and later): the slider and its track
set -gq pane-scrollbars-style "fg=#657178,bg=#e9ebe5,width=1,pad=0"
# Copy mode line numbers (tmux 3.7 and later)
set -gq copy-mode-line-number-style "fg=#657178"
set -gq copy-mode-current-line-number-style "fg=#9b5a00"
