# {{variant.name}} for tmux, from {{meta.name}} {{meta.version}}: {{meta.repository}}
# Save it as ~/.config/tmux/{{variant.slug}}.conf and add this line to tmux.conf:
#   source-file ~/.config/tmux/{{variant.slug}}.conf
# Colors only: it changes no keys, formats or layout. Needs tmux 3.4 or later.

# The status line: a recessed bar, like a title bar
set -g status-style "fg={{dim}},bg={{deeper}}"
set -g status-left-style "fg={{text}},bg={{deeper}}"
set -g status-right-style "fg={{dim}},bg={{deeper}}"

# The window list: the current window is "you are here"
set -g window-status-style "fg={{dim}},bg={{deeper}}"
set -g window-status-last-style "fg={{dim}},bg={{deeper}}"
set -g window-status-current-style "fg={{accent}},bg={{base}}"
set -g window-status-activity-style "fg={{info}},bg={{deeper}}"
set -g window-status-bell-style "fg={{warning}},bg={{deeper}},bold"

# Pane borders: the active pane is "you are here"
set -g pane-border-style "fg={{line}}"
set -g pane-active-border-style "fg={{accent}}"

# Messages and the command prompt
# fill covers the whole line in tmux 3.7 and later
set -g message-style "fg={{text}},bg={{raised}},fill={{raised}}"
set -g message-command-style "fg={{text}},bg={{raised}},fill={{raised}}"

# Copy mode and the choose modes: the selection and the selected row.
# Newer tmux takes the copy mode selection and position styles from this one.
set -g mode-style "fg={{text}},bg={{accent|wash}}"

# Copy mode search: every match, then the match at the cursor
set -g copy-mode-match-style "fg={{text}},bg={{steel|wash}}"
set -g copy-mode-current-match-style "fg={{on_accent}},bg={{accent}}"

# Copy mode: the line holding the mark
set -g copy-mode-mark-style "fg={{text}},bg={{tag|wash}}"

# Menus and popups
set -g menu-style "fg={{text}},bg={{raised}}"
set -g menu-selected-style "fg={{text}},bg={{accent|wash}}"
set -g menu-border-style "fg={{line}},bg={{raised}}"
set -g popup-style "fg={{text}},bg={{raised}}"
set -g popup-border-style "fg={{line}},bg={{raised}}"

# The pane numbers display-panes shows, and the clock mode clock
set -g display-panes-colour "{{info}}"
set -g display-panes-active-colour "{{accent}}"
set -g clock-mode-colour "{{info}}"

# Newer tmux only: -q skips them quietly where tmux does not have them
# Pane scrollbars (tmux 3.6 and later): the slider and its track
set -gq pane-scrollbars-style "fg={{faint}},bg={{deep}},width=1,pad=0"
# Copy mode line numbers (tmux 3.7 and later)
set -gq copy-mode-line-number-style "fg={{faint}}"
set -gq copy-mode-current-line-number-style "fg={{accent}}"
