<!DOCTYPE html>
<html lang="en" data-variant="night">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- build/site.ps1 makes one page per port from this file: it fills the guide:* slots
     from the port's port.json and README.md. Opened as is, the page is an empty shell. -->
<title><!-- guide:title --></title>
<meta name="description" content="Step-by-step install guide for <!-- guide:title -->, Inglenook Day and Inglenook Night.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Serif:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../day/theme.css">
<link rel="stylesheet" href="../../night/theme.css">
<link rel="stylesheet" href="../base.css">
<script src="../variant.js"></script>
<style>
/* Every color on this page is a palette variable from theme.css. Do not add color values here. */
main {
  max-width: 860px;
  margin: 0 auto;
  padding: 24px 16px 48px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.crumbs { padding: 10px 16px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px 16px; font-size: .9rem; }
.crumbs p { margin: 0; display: flex; flex-wrap: wrap; gap: 6px 16px; }

/* The guide: README.md rendered to HTML. */
.guide { padding: 8px 28px 28px; overflow-wrap: break-word; }
.guide h1 { font: 600 1.9rem/1.15 var(--font-display); margin: 20px 0 12px; text-wrap: balance; }
.guide h2 { font: 600 1.3rem/1.25 var(--font-display); margin: 32px 0 10px; padding-top: 16px; border-top: 1px solid var(--line); }
.guide h3 { font: 600 1.05rem/1.3 var(--font-display); margin: 22px 0 8px; }
.guide h2, .guide h3 { scroll-margin-top: 64px; }
.guide p, .guide ul, .guide ol, .guide table, .guide pre, .guide blockquote { margin: 0 0 12px; }
.guide ul, .guide ol { padding-left: 1.5em; }
.guide li + li { margin-top: 4px; }
.guide li > p { margin: 0 0 6px; }
.guide li > pre, .guide li > table { margin-top: 8px; }
.guide strong { font-weight: 500; color: var(--text); }
.guide code { font: .85em var(--font-mono); color: var(--literal); }
.guide pre {
  padding: 12px 14px; overflow-x: auto;
  background: var(--deep); border: 1px solid var(--line); border-radius: 8px;
}
.guide :not(pre) > code { overflow-wrap: anywhere; }
.guide pre code { color: var(--text); font-size: .85rem; }
.guide table { display: block; overflow-x: auto; border-collapse: collapse; font-size: .92rem; }
.guide th, .guide td { padding: 6px 12px; border: 1px solid var(--line); text-align: left; vertical-align: top; }
.guide th { font-weight: 500; background: var(--deep); }
.guide img { max-width: 100%; height: auto; border-radius: 6px; border: 1px solid var(--line); }
.guide blockquote { padding: 2px 14px; border-left: 3px solid var(--line); color: var(--dim); }
.guide hr { border: none; border-top: 1px solid var(--line); margin: 20px 0; }
footer { padding: 14px 16px; color: var(--dim); font-size: .8rem; }
footer p { margin: 0; }
footer p + p { margin-top: 4px; }

@media (max-width: 480px) {
  .guide { padding: 4px 16px 20px; }
}
</style>
</head>
<body>
<div class="topbar">
  <span class="brand">Inglenook<small>v0.1.0</small></span>
  <div class="topbar-end">
    <a class="repo" href="../index.html">Preview</a>
    <a class="repo" href="https://github.com/mookeyj79/Inglenook">GitHub</a>
    <nav class="switch" aria-label="Variant">
      <a href="?variant=day" data-set="day">Day</a>
      <a href="?variant=night" data-set="night">Night</a>
    </nav>
  </div>
</div>

<main>
  <nav class="panel crumbs" aria-label="Guide">
    <p><a href="../ports.html">All ports</a></p>
    <p><a href="<!-- guide:files -->">Theme files</a> <a href="<!-- guide:source -->">This guide on GitHub</a></p>
  </nav>

  <article class="panel guide">
<!-- guide:body -->
  </article>

  <footer class="panel">
    <p>Inglenook 0.1.0. This page is the port's README.md, published with every change to it.</p>
    <p class="credit">Wallpapers: <a href="https://commons.wikimedia.org/wiki/File:Cozy_interior_of_a_wooden_cabin_with_a_seating_area.jpg">Cabin Seating</a> (Day) by Shixart1985, <a href="https://creativecommons.org/licenses/by/2.0">CC BY 2.0</a>. <a href="https://commons.wikimedia.org/wiki/File:The_fireplace_in_the_dining_room_of_the_mission_house_at_the_The_Elms_-_Formerly_the_Te_Papa_Mission_Station.jpg">Mission Fireplace</a> (Night) by Richard N Horne, <a href="https://creativecommons.org/licenses/by-sa/4.0">CC BY-SA 4.0</a>.</p>
  </footer>
</main>

</body>
</html>
