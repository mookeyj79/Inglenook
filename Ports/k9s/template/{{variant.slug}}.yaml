# {{variant.name}} for K9s, from {{meta.name}} {{meta.version}}: {{meta.repository}}
# Save it in K9s's skins folder and set k9s.ui.skin: {{variant.slug}} in config.yaml.
k9s:
  # The main background and text, and the logo at the top right
  body:
    fgColor: '{{text}}'
    bgColor: '{{base}}'
    logoColor: '{{dim}}'
    # Messages shown in place of the logo
    logoColorMsg: '{{text}}'
    logoColorInfo: '{{info}}'
    logoColorWarn: '{{warning}}'
    logoColorError: '{{error}}'
  # The command (:) and filter (/) prompt
  prompt:
    fgColor: '{{text}}'
    bgColor: '{{raised}}'
    suggestColor: '{{faint}}'
    border:
      command: '{{accent}}'
      default: '{{info}}'
  # The help screen (?)
  help:
    fgColor: '{{text}}'
    bgColor: '{{base}}'
    sectionColor: '{{dim}}'
    keyColor: '{{info}}'
    numKeyColor: '{{literal}}'
  frame:
    # The view's title: Pods(all)[12]
    title:
      fgColor: '{{text}}'
      bgColor: '{{base}}'
      highlightColor: '{{reference}}'
      counterColor: '{{literal}}'
      filterColor: '{{info}}'
    border:
      fgColor: '{{line}}'
      focusColor: '{{accent}}'
    # The shortcut menu at the top
    menu:
      fgColor: '{{dim}}'
      keyColor: '{{info}}'
      numKeyColor: '{{literal}}'
    # The breadcrumbs at the bottom; the current view is the last one
    crumbs:
      fgColor: '{{text}}'
      bgColor: '{{raised}}'
      activeColor: '{{accent|wash}}'
    # Row colors by state
    status:
      newColor: '{{text}}'
      modifyColor: '{{warning}}'
      addColor: '{{success}}'
      pendingColor: '{{warning}}'
      errorColor: '{{error}}'
      highlightColor: '{{info}}'
      killColor: '{{error}}'
      completedColor: '{{faint}}'
  # The cluster summary at the top left
  info:
    fgColor: '{{text}}'
    sectionColor: '{{dim}}'
    cpuColor: '{{text}}'
    memColor: '{{text}}'
    k9sRevColor: '{{text}}'
  views:
    table:
      fgColor: '{{text}}'
      bgColor: '{{base}}'
      cursorFgColor: '{{text}}'
      cursorBgColor: '{{accent|wash}}'
      markColor: '{{accent}}'
      header:
        fgColor: '{{dim}}'
        bgColor: '{{base}}'
        sorterColor: '{{info}}'
        selectedSortColumnColor: '{{text}}'
    xray:
      fgColor: '{{text}}'
      bgColor: '{{base}}'
      cursorColor: '{{accent|wash}}'
      cursorTextColor: '{{text}}'
      graphicColor: '{{dim}}'
    # The pulses view
    charts:
      bgColor: '{{base}}'
      chartBgColor: '{{base}}'
      dialBgColor: '{{base}}'
      focusFgColor: '{{on_accent}}'
      focusBgColor: '{{accent}}'
      defaultDialColors:
        - '{{success}}'
        - '{{error}}'
      defaultChartColors:
        - '{{success}}'
        - '{{error}}'
      resourceColors:
        cpu:
          - '{{steel}}'
          - '{{heather}}'
        mem:
          - '{{pine}}'
          - '{{ivy}}'
    yaml:
      keyColor: '{{info}}'
      valueColor: '{{text}}'
      colonColor: '{{dim}}'
    # Pickers such as the container list
    picker:
      mainColor: '{{text}}'
      focusColor: '{{accent}}'
      shortcutColor: '{{info}}'
    logs:
      fgColor: '{{text}}'
      bgColor: '{{base}}'
      indicator:
        fgColor: '{{dim}}'
        bgColor: '{{base}}'
        toggleOnColor: '{{success}}'
        toggleOffColor: '{{faint}}'
  # Confirm and delete dialogs
  dialog:
    fgColor: '{{text}}'
    bgColor: '{{raised}}'
    buttonFgColor: '{{text}}'
    buttonBgColor: '{{hover}}'
    buttonFocusFgColor: '{{on_accent}}'
    buttonFocusBgColor: '{{accent}}'
    labelFgColor: '{{dim}}'
    fieldFgColor: '{{text}}'
