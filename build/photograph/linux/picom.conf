# The compositor every Linux shot is taken with: the window's soft shadow, nothing else.
# Inglenook surfaces are solid, so there is no blur.
backend = "xrender";
vsync = false;
# Every frame repaints the whole screen, so a take never depends on the order the
# app repainted in.
use-damage = false;
shadow = true;
shadow-radius = 28;
shadow-opacity = 0.45;
shadow-offset-x = -28;
shadow-offset-y = -18;
# An app that draws its own frame (VS Code) also draws its own shadow, in a clear
# margin it names in _GTK_FRAME_EXTENTS. A picom shadow there would start at the
# margin's outer edge and leave a pale band between the two shadows.
shadow-exclude = [ "_GTK_FRAME_EXTENTS@:c" ];
fading = false;
